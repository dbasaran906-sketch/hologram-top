name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Uygulama dosyalarını hazırla
        run: |
          [ -f index.html ] || cat > index.html <<'EOF_INDEX'
          <!doctype html>
          <html lang="tr">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Hologram Top</title>
          <style>
            html, body { margin: 0; height: 100%; background: #050b14; color: #d4f0ff; font-family: system-ui, sans-serif; overflow: hidden; }
            video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .45; }
            canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
            #hud { position: fixed; top: 12px; left: 0; right: 0; text-align: center; font-size: 12px; letter-spacing: .08em; color: #8fb6cc; pointer-events: none; padding: 0 16px; }
            #retry { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: none; font-size: 16px; padding: 12px 24px; border-radius: 12px; border: 1px solid #3cc8ff; background: #0b2b40; color: #d4f0ff; }
          </style>
          </head>
          <body>
          <video id="v" playsinline muted autoplay></video>
          <canvas id="c"></canvas>
          <div id="hud">Kamera açılıyor...</div>
          <button id="retry">Tekrar dene</button>

          <script type="module">
          import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

          const v = document.getElementById("v");
          const cv = document.getElementById("c");
          const ctx = cv.getContext("2d");
          const hud = document.getElementById("hud");
          const retry = document.getElementById("retry");
          const R = 34;
          let W = 0, H = 0, dpr = 1;
          const ball = { x: 0, y: 0, vx: 0, vy: 0 };
          let held = false, pinching = false, hand = null, cur = null;
          let samples = [];
          let landmarker = null;
          let running = false;
          let status = "";

          function resize() {
            dpr = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth; H = innerHeight;
            cv.width = W * dpr; cv.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (!ball.x) { ball.x = W / 2; ball.y = H / 2; }
          }
          addEventListener("resize", resize);
          resize();

          async function makeLandmarker(fileset, delegate) {
            return HandLandmarker.createFromOptions(fileset, {
              baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: delegate
              },
              runningMode: "VIDEO",
              numHands: 1
            });
          }

          async function start() {
            retry.style.display = "none";
            status = "Kamera açılıyor...";
            hud.textContent = status;
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
              });
              v.srcObject = stream;
              await v.play();
              hud.textContent = "El modeli yükleniyor...";
              const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
              try { landmarker = await makeLandmarker(fileset, "GPU"); }
              catch (e) { landmarker = await makeLandmarker(fileset, "CPU"); }
              if (!running) { running = true; requestAnimationFrame(loop); }
            } catch (e) {
              hud.textContent = "Açılamadı: " + (e && e.message ? e.message : e);
              retry.style.display = "block";
            }
          }
          retry.addEventListener("click", start);
          start();

          function toScreen(lm) {
            const vw = v.videoWidth, vh = v.videoHeight;
            const s = Math.max(W / vw, H / vh);
            const offX = (vw * s - W) / 2, offY = (vh * s - H) / 2;
            return { x: (1 - lm.x) * vw * s - offX, y: lm.y * vh * s - offY };
          }

          function updateHand(now) {
            if (!landmarker || v.readyState < 2) return;
            const res = landmarker.detectForVideo(v, now);
            if (!res.landmarks || !res.landmarks.length) { hand = null; pinching = false; cur = null; return; }
            const lm = res.landmarks[0];
            const size = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 0.1;
            const pd = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) / size;
            if (!pinching && pd < 0.30) pinching = true;
            else if (pinching && pd > 0.45) pinching = false;
            const a = toScreen(lm[4]), b = toScreen(lm[8]);
            const target = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            cur = cur ? { x: cur.x + (target.x - cur.x) * 0.5, y: cur.y + (target.y - cur.y) * 0.5 } : target;
            hand = cur;
          }

          let last = performance.now();
          function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.033);
            last = now;
            updateHand(now);

            if (hand && pinching && !held && Math.hypot(hand.x - ball.x, hand.y - ball.y) < R * 2.6) {
              held = true; samples = []; ball.vx = 0; ball.vy = 0;
            }
            if (held && (!pinching || !hand)) {
              held = false;
              if (samples.length > 1) {
                const a = samples[0], b = samples[samples.length - 1];
                const t = (b.t - a.t) / 1000;
                if (t > 0.01) {
                  ball.vx = (b.x - a.x) / t; ball.vy = (b.y - a.y) / t;
                  const s = Math.hypot(ball.vx, ball.vy);
                  if (s > 3500) { ball.vx *= 3500 / s; ball.vy *= 3500 / s; }
                }
              }
            }
            if (held && hand) {
              ball.x = Math.min(Math.max(hand.x, R), W - R);
              ball.y = Math.min(Math.max(hand.y, R), H - R);
              samples.push({ x: ball.x, y: ball.y, t: now });
              while (samples.length > 2 && now - samples[0].t > 90) samples.shift();
            } else {
              ball.x += ball.vx * dt; ball.y += ball.vy * dt;
              const d = Math.exp(-0.9 * dt);
              ball.vx *= d; ball.vy *= d;
              if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx) * .82; }
              if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * .82; }
              if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy) * .82; }
              if (ball.y > H - R) { ball.y = H - R; ball.vy = -Math.abs(ball.vy) * .82; }
            }

            hud.textContent = !hand ? "Elini kameraya göster" : held ? "Tuttun" : pinching ? "Çimdik: topa yaklaş" : "Çimdik yap";
            draw();
            requestAnimationFrame(loop);
          }

          function draw() {
            ctx.clearRect(0, 0, W, H);
            const g = ctx.createRadialGradient(ball.x, ball.y, R * .2, ball.x, ball.y, R * 2.4);
            g.addColorStop(0, "rgba(60,200,255,.5)"); g.addColorStop(1, "rgba(60,200,255,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ball.x, ball.y, R * 2.4, 0, 7); ctx.fill();
            const b = ctx.createRadialGradient(ball.x - R * .35, ball.y - R * .35, R * .1, ball.x, ball.y, R);
            b.addColorStop(0, "#e6f8ff"); b.addColorStop(.55, "#3cc8ff"); b.addColorStop(1, "#0b4f7a");
            ctx.fillStyle = b; ctx.beginPath(); ctx.arc(ball.x, ball.y, held ? R * 1.12 : R, 0, 7); ctx.fill();
            if (hand) {
              ctx.beginPath(); ctx.arc(hand.x, hand.y, pinching ? 9 : 14, 0, 7);
              ctx.strokeStyle = pinching ? "#ffffff" : "#3cc8ff"; ctx.lineWidth = 3; ctx.stroke();
            }
          }
          </script>
          </body>
          </html>
          EOF_INDEX
          [ -f package.json ] || cat > package.json <<'EOF_PACKAGE'
          {
            "name": "hologram-top",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          EOF_PACKAGE
          [ -f capacitor.config.json ] || cat > capacitor.config.json <<'EOF_CAPACITOR'
          {
            "appId": "com.hologram.top",
            "appName": "Hologram Top",
            "webDir": "www"
          }
          EOF_CAPACITOR
          mkdir -p www
          cp index.html www/

      - name: Bağımlılıkları kur
        run: npm install

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Kamera iznini ekle
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$F"
          grep -n "CAMERA" "$F"

      - name: Web dosyalarını Android'e aktar
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk hologram-top.apk
          gh release create "v${{ github.run_number }}" hologram-top.apk \
            --title "Sürüm ${{ github.run_number }}" \
            --notes "Telefonda indirip kurabilirsin."
